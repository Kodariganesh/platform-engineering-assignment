name: Validate platform assignment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run FastAPI tests
        run: python -m pytest -v tests

      - name: Smoke-test Uvicorn
        shell: bash
        run: |
          python -m uvicorn app.server:app --host 127.0.0.1 --port 8080 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --max-time 5 --retry 5 \
            --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/health

      - name: Check Bash syntax
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -no-color
          terraform validate -no-color

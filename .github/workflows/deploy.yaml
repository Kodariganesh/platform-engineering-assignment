name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview infrastructure changes or apply a fresh plan
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_subnet_id: ${{ vars.TF_SUBNET_ID }}

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check production settings
        run: |
          for name in AWS_REGION AWS_ACCOUNT_ID TF_STATE_BUCKET TF_VAR_subnet_id; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing production setting: %s\n' "$name" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Initialize production state
        run: |
          # Use S3 in the deploy runner. Local development keeps its own state.
          (set -o noclobber; printf 'terraform {\n  backend "s3" {}\n}\n' > github-backend.tf)
          terraform init -input=false -no-color -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=platform-assignment/production.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Plan production changes
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=production.tfplan

      - name: Apply the plan from this run
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m production.tfplan

      - name: Verify the public app
        if: inputs.operation == 'apply'
        run: |
          app_url="$(terraform output -raw app_url)"
          printf 'App URL: %s\n' "$app_url"
          body="$(curl --fail --silent --show-error --max-time 5 --retry 30 \
            --retry-all-errors --retry-delay 10 --retry-max-time 300 "$app_url/health")"
          [[ "$body" == "OK" ]]
